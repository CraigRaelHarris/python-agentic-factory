[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-project"
version = "0.1.0"
description = "Project generated from the Python Agentic Engineering Factory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.6",
  "torch>=2.6",
]
spark = [
  "pyspark>=4.0",
]
postgres = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
]
dev = [
  "bandit>=1.8",
  "mypy>=1.15",
  "pip-audit>=2.8",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "integration: integration tests",
  "acceptance: acceptance tests",
  "slow: slow tests",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
